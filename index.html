<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Khayal</title>
    <meta name="description" content="I keep three worlds in one head." />
    <!-- Təhlükəsizlik: referrer + nosniff hər rejimdə zərərsizdir.
         CSP isə YALNIZ production build-ə əlavə olunur (vite.config.ts → `cspMeta`).
         Səbəb: dev-də Vite stilləri `<style>` teqləri ilə yeridir və `style-src 'self'`
         onları bloklayır → sayt tam stilsiz görünür (ölçülmüş: h1 32px, Times New Roman). -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
