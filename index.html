<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Khayal — Portfolio</title>
    <meta name="description" content="I keep more worlds than one head should hold. Scroll — I'll show you a few." />
    <link rel="canonical" href="https://hypnosdev.vercel.app/" />
    <meta name="theme-color" content="#0e100f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Paylaşım önizləməsi (OG) — link atılanda boş kart yox, saytın üzbəüz görünüşü -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khayal" />
    <meta property="og:title" content="Khayal — Portfolio" />
    <meta property="og:description" content="I keep more worlds than one head should hold. Scroll — I'll show you a few." />
    <meta property="og:url" content="https://hypnosdev.vercel.app/" />
    <meta property="og:image" content="https://hypnosdev.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Khayal — Portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Khayal — Portfolio" />
    <meta name="twitter:description" content="I keep more worlds than one head should hold. Scroll — I'll show you a few." />
    <meta name="twitter:image" content="https://hypnosdev.vercel.app/og.jpg" />
    <!-- Təhlükəsizlik: referrer + nosniff hər rejimdə zərərsizdir.
         CSP isə YALNIZ production build-ə əlavə olunur (vite.config.ts → `cspMeta`).
         Səbəb: dev-də Vite stilləri `<style>` teqləri ilə yeridir və `style-src 'self'`
         onları bloklayır → sayt tam stilsiz görünür (ölçülmüş: h1 32px, Times New Roman). -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- M8: pərdənin arxasında görünəcək ilk kadr (leap posteri) — şəbəkə prioriteti ən yüksək -->
    <link rel="preload" as="image" href="/leap/poster-1920.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
